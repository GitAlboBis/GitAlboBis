name: Generate Aura README & Contribution Snake

on:
  push:
    branches: [main, master]
    paths:
      - 'readme.source.md'
      - 'scripts/**'
      - '.github/profile-3d.json'
      - '.github/workflows/readme-aura.yml'
  schedule:
    # Si aggiorna automaticamente ogni giorno alle 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Asset dinamici self-hosted -> branch `output`
  #    (snake, contributi 3D, card neofetch con statistiche live).
  #    Niente servizi esterni su Vercel che vanno in rate-limit.
  generate-live-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate contribution snake (dark + light, brand palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6366f1&color_dots=#ebedf0,#a5f3fc,#22d3ee,#6366f1,#7c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0e7490,#06b6d4,#6366f1,#a855f7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate live neofetch card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          node scripts/generate-live-cards.mjs dist
          cp profile-3d-contrib/*.svg dist/ 2>/dev/null || true
          node scripts/patch-3d-contrib.mjs dist
          ls -la dist

      - name: Push live assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Compila i blocchi React/JSX ```aura in SVG e rigenera README.md
  generate-readme-aura:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Render JSX Aura Components to SVG
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
