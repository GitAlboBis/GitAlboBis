    <radialGradient id="glow1" cx="1" cy="0" r="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <g clip-path="url(#clip1)">
