    <text x="328" y="201" class="det">17 scroll-locked 3D scenes</text>
    <rect x="328" y="227" width="240" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect class="bar b1" x="328" y="227" width="240" height="6" rx="3" fill="url(#g1)"/>
  </g>
  <g class="card c2">
