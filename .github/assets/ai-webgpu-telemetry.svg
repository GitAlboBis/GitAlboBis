<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 272" width="1200" height="272" role="img" aria-label="Production impact metrics">
<defs>
  <linearGradient id="cardBg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0a0e1b"/><stop offset="1" stop-color="#05070f"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <style>
    .lbl { font: 600 10.5px 'JetBrains Mono','Geist Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace; fill: #94a3b8; letter-spacing: 1.6px; }
    .big { font: 700 46px 'Geist','SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,system-ui,-apple-system,sans-serif; letter-spacing: -1.5px; }
    .sub { font: 600 14px 'Geist','SF Pro Display','Segoe UI Variable Display','Segoe UI',Inter,system-ui,-apple-system,sans-serif; fill: #e2e8f0; }
    .det { font: 400 11.5px 'JetBrains Mono','Geist Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace; fill: #64748b; }
    .card { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .c1 { animation-delay: .1s } .c2 { animation-delay: .2s } .c3 { animation-delay: .3s }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .b0 { animation-delay: .5s } .b1 { animation-delay: .6s } .b2 { animation-delay: .7s } .b3 { animation-delay: .8s }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .sheen { animation: sheen 7s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .s1 { animation-delay: .6s } .s2 { animation-delay: 1.2s } .s3 { animation-delay: 1.8s }
    @keyframes sheen { 0%, 55% { transform: translateX(0); } 100% { transform: translateX(480px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</defs>
  <g class="card c0">
    <clipPath id="clip0"><rect x="0" y="5" width="288" height="262" rx="20"/></clipPath>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="glow0" cx="1" cy="0" r="1"><stop offset="0" stop-color="#34d399" stop-opacity="0.22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
