    </g>
    <rect x="0.5" y="5.5" width="287" height="261" rx="19.5" fill="none" stroke="rgba(255,255,255,0.09)"/>
    <rect x="24" y="5" width="240" height="1" fill="url(#g0)" opacity="0.8"/>
    <rect x="24" y="31" width="28" height="5" rx="2.5" fill="url(#g0)"/>
    <text x="24" y="61" class="lbl">SPHERE AI // RAG MENTOR</text>
