<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <style>
      .card-label { font: 700 11px 'JetBrains Mono', monospace; fill: #94A3B8; letter-spacing: 1.2px; }
      .metric-big { font: 800 34px 'Segoe UI', Inter, system-ui, sans-serif; }
      .metric-sub { font: 600 12.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #CBD5E1; }
      .metric-detail { font: 500 11px 'JetBrains Mono', monospace; fill: #64748B; }

      @keyframes fillBar100 {
        0% { width: 0px; }
        100% { width: 196px; }
      }
      @keyframes fillBar94 {
        0% { width: 0px; }
        100% { width: 184px; }
      }
      .bar-anim-100 { animation: fillBar100 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-anim-94 { animation: fillBar94 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
  </defs>

  <!-- CARD 1: SPHERE AI RAG CITATION ACCURACY -->
  <g transform="translate(10, 12)">
    <rect width="232" height="205" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="18" y="18" width="42" height="6" rx="3" fill="#10B981" />
    <text x="18" y="46" class="card-label">SPHERE AI // RAG MENTOR</text>
    <text x="18" y="92" class="metric-big" fill="#10B981">100%</text>
    <text x="18" y="118" class="metric-sub">Citation Correctness</text>
    <text x="18" y="140" class="metric-detail">94% Precision · 90% Recall</text>
    <text x="18" y="158" class="metric-detail">0 Leaks on 161 Bilingual Evals</text>
    <rect x="18" y="174" width="196" height="8" rx="4" fill="#1E293B" />
    <rect class="bar-anim-100" x="18" y="174" width="196" height="8" rx="4" fill="url(#barCyan)" />
  </g>

  <!-- CARD 2: WEBGPU & COMPUTE SHADERS -->
  <g transform="translate(259, 12)">
    <rect width="232" height="205" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="18" y="18" width="42" height="6" rx="3" fill="#38BDF8" />
    <text x="18" y="46" class="card-label">WEBGPU // WGSL SHADERS</text>
    <text x="18" y="92" class="metric-big" fill="#38BDF8">120,000</text>
    <text x="18" y="118" class="metric-sub">Real-Time GPU Fluid Particles</text>
    <text x="18" y="140" class="metric-detail">+48k Wordmark &amp; 80k Morph</text>
    <text x="18" y="158" class="metric-detail">17 Scroll-Locked 3D Scenes</text>
    <rect x="18" y="174" width="196" height="8" rx="4" fill="#1E293B" />
    <rect class="bar-anim-100" x="18" y="174" width="196" height="8" rx="4" fill="url(#barAmber)" />
  </g>

  <!-- CARD 3: CORE WEB VITALS & MOBILE PERF -->
  <g transform="translate(508, 12)">
    <rect width="232" height="205" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="18" y="18" width="42" height="6" rx="3" fill="#A855F7" />
    <text x="18" y="46" class="card-label">LIGHTHOUSE // PERF &amp; A11Y</text>
    <text x="18" y="92" class="metric-big" fill="#C084FC">100 / 100</text>
    <text x="18" y="118" class="metric-sub">Accessibility &amp; SEO Score</text>
    <text x="18" y="140" class="metric-detail">Mobile LCP: 4.75s → 1.74s</text>
    <text x="18" y="158" class="metric-detail">Device-Tiered Mobile Shaders</text>
    <rect x="18" y="174" width="196" height="8" rx="4" fill="#1E293B" />
    <rect class="bar-anim-100" x="18" y="174" width="196" height="8" rx="4" fill="url(#barPurple)" />
  </g>

  <!-- CARD 4: SECURITY HARDENING & RELEASES -->
  <g transform="translate(757, 12)">
    <rect width="232" height="205" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="18" y="18" width="42" height="6" rx="3" fill="#F43F5E" />
    <text x="18" y="46" class="card-label">SECURITY // DEVSECOPS</text>
    <text x="18" y="92" class="metric-big" fill="#FB7185">Zero-Trust</text>
    <text x="18" y="118" class="metric-sub">33 Audit Findings Remediated</text>
    <text x="18" y="140" class="metric-detail">9-Role Postgres 17 RLS + pgTAP</text>
    <text x="18" y="158" class="metric-detail">21/49 Production Releases Led</text>
    <rect x="18" y="174" width="196" height="8" rx="4" fill="#1E293B" />
    <rect class="bar-anim-94" x="18" y="174" width="184" height="8" rx="4" fill="url(#barPurple)" />
  </g>
</svg>