    <rect x="632" y="31" width="28" height="5" rx="2.5" fill="url(#g2)"/>
    <text x="632" y="61" class="lbl">LIGHTHOUSE // PERF &amp; A11Y</text>
    <text x="630" y="121" class="big" fill="url(#g2)">100/100</text>
    <text x="632" y="151" class="sub">Accessibility &amp; SEO</text>
